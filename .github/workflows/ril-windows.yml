# Membangun Ril.exe (aplikasi kiosk laptop toko) setiap push.
# Hasil: tab Actions > run terakhir > Artifacts (Ril.exe + skrip pasang).
name: Ril Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Ril.exe
        run: >
          dotnet publish Ril/Ril.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=0.1.${{ github.run_number }} -o keluaran

      - name: Kumpulkan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force rilis | Out-Null
          Copy-Item keluaran/Ril.exe rilis/
          Copy-Item skrip/*.ps1 rilis/
          Copy-Item README.md rilis/BACA.md

      - uses: actions/upload-artifact@v4
        with:
          name: ril-windows-${{ github.run_number }}
          path: rilis/
          retention-days: 30
